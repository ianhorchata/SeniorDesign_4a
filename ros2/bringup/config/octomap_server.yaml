octomap_server:
  ros__parameters:
    # Voxel size in metres. Larger (e.g. 0.1) is much faster and lighter in RViz.
    resolution: 0.05
    frame_id: map
    base_frame_id: base_link
    # Color occupied voxels by height in RViz.
    use_height_map: true
    # Lidar maxRange is 30 m; the break room is 20 x 20 m.
    sensor_model.max_range: 15.0
    # No height limits (point_cloud_min_z/max_z, occupancy_min_z/max_z): the floors
    # stay in the map, because the path planner needs them to know where the robot
    # can stand. /projected_map therefore shows floor as occupied and is not useful.
    # Publish only to topics that have subscribers, instead of always preparing all of them.
    latch: false
